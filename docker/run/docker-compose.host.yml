# Host-network Docker setup (default for this fork).
# Host networking lets A0 reach local gateways on 127.0.0.1 exactly like bare metal.
#
#   A0_PORT=5080 docker compose -f docker/run/docker-compose.host.yml up -d
#   A0_PORT=5080 docker compose -f docker/run/docker-compose.host.yml logs -f
#   A0_PORT=5080 docker compose -f docker/run/docker-compose.host.yml down
services:
  agent-zero:
    container_name: ${A0_CONTAINER_NAME:-agent-zero}
    image: ${A0_IMAGE:-agent0ai/agent-zero:latest}
    network_mode: host
    environment:
      A0_WEB_UI_PORT: ${A0_PORT:-80}
      A0_WEB_UI_HOST: ${A0_WEB_UI_HOST:-127.0.0.1}
    volumes:
      - ../..:/a0
      - ../../docker/run/fs/exe/self_update_manager.py:/exe/self_update_manager.py:ro
      - ../../docker/run/fs/exe/run_tunnel_api.sh:/exe/run_tunnel_api.sh:ro
      - ../../docker/run/fs/etc/supervisor/conf.d/supervisord.host-network.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    # sshd and the bundled SearXNG are omitted: host ports 22 and 8080/55510 collide.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
